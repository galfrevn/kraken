# kraken agent configuration
# docs: https://github.com/kraken-agent/kraken

repo: "."

languageModel:
  provider: openrouter
  model: deepseek/deepseek-v3.2
  apiKey: "${OPENROUTER_API_KEY}"
  temperature: 0.7
  maxTokens: 16384

security:
  defaultPolicy: review_required
  rules:
    - trigger: manual
      policy: auto
    - trigger: cron
      policy: review_required
    - trigger: webhook
      policy: review_required
    - trigger: file_change
      policy: review_required
    - trigger: companion
      policy: review_required

git:
  branchPrefix: "kraken/"
  autoCommit: true
  commitPrefix: "kraken:"

services:
  schedulerUrl: "http://localhost:50051"
  gatewayUrl: "http://localhost:50052"

scheduler:
  crons: []
    # - name: daily-review
    #   expression: "0 9 * * *"
    #   task: review-open-prs

  watchers: []
    # - name: src-watcher
    #   paths: ["./src"]
    #   ignore: ["node_modules", ".git", "target", "dist"]
    #   debounceMs: 500

plugins: []
