name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            rust_target: aarch64-apple-darwin
            go_os: darwin
            go_arch: arm64
          - os: macos-13
            platform: darwin-x64
            rust_target: x86_64-apple-darwin
            go_os: darwin
            go_arch: amd64
          - os: ubuntu-latest
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            go_os: linux
            go_arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            go_os: linux
            go_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/gateway/go.mod

      - name: Build scheduler
        working-directory: apps/scheduler
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Build gateway
        working-directory: apps/gateway
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
          CGO_ENABLED: "0"
        run: go build -o gateway ./cmd/gateway

      - name: Package release
        run: |
          mkdir -p release
          cp apps/scheduler/target/${{ matrix.rust_target }}/release/scheduler release/
          cp apps/gateway/gateway release/
          tar -czf kraken-${{ matrix.platform }}.tar.gz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kraken-${{ matrix.platform }}
          path: kraken-${{ matrix.platform }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
