name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 📦 Build — ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            rust_target: aarch64-apple-darwin
            go_os: darwin
            go_arch: arm64
          - os: macos-latest
            platform: darwin-x64
            rust_target: x86_64-apple-darwin
            go_os: darwin
            go_arch: amd64
          - os: ubuntu-latest
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            go_os: linux
            go_arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            go_os: linux
            go_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/gateway/go.mod

      - name: 📦 Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: 💾 Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/scheduler/target
          key: rust-${{ runner.os }}-${{ matrix.rust_target }}-${{ hashFiles('apps/scheduler/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ matrix.rust_target }}-

      - name: 🦀 Build scheduler
        working-directory: apps/scheduler
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: 🐹 Build gateway
        working-directory: apps/gateway
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
          CGO_ENABLED: "0"
        run: go build -o gateway ./cmd/gateway

      - name: 📦 Package release artifacts
        run: |
          mkdir -p release
          cp apps/scheduler/target/${{ matrix.rust_target }}/release/scheduler release/
          cp apps/gateway/gateway release/
          tar -czf kraken-${{ matrix.platform }}.tar.gz -C release .

      - name: ☁️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kraken-${{ matrix.platform }}
          path: kraken-${{ matrix.platform }}.tar.gz

  publish:
    name: 🚀 Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 🏷️ Extract version tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kraken ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
