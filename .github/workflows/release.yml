name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-app:
    name: Build — App bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Bundle TUI app
        run: |
          mkdir -p dist/app
          bun build apps/app/src/index.tsx --outdir dist/app --target bun
          cd dist/app && for f in *.wasm; do
            base=$(echo "$f" | sed -E 's/-[a-z0-9]{8}\.wasm$/.wasm/')
            [ "$base" != "$f" ] && cp "$f" "$base"
          done

      - name: Bundle worker
        run: bun build apps/app/src/worker.ts --outfile dist/worker.js --target bun

      - name: Bundle channel worker
        run: bun build apps/app/src/channel-worker.ts --outfile dist/channel-worker.js --target bun

      - name: Copy skills
        run: |
          mkdir -p dist/skills
          for skill_dir in packages/skills/*/; do
            skill_name=$(basename "$skill_dir")
            mkdir -p "dist/skills/$skill_name"
            cp "$skill_dir"SKILL.md "dist/skills/$skill_name/SKILL.md" 2>/dev/null || true
          done

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: kraken-app-bundle
          path: dist/

  build:
    name: Build — ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            rust_target: aarch64-apple-darwin
            ext: ""
          - os: macos-latest
            platform: darwin-x64
            rust_target: x86_64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/daemon/target
          key: rust-${{ runner.os }}-${{ matrix.rust_target }}-${{ hashFiles('apps/daemon/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ matrix.rust_target }}-

      - name: Build daemon
        working-directory: apps/daemon
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Upload daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: kraken-daemon-${{ matrix.platform }}
          path: apps/daemon/target/${{ matrix.rust_target }}/release/kraken${{ matrix.ext }}

  publish:
    name: Publish GitHub Release
    needs: [build, build-app]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract version tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release artifacts
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "Packaging $platform..."
            mkdir -p "release/$platform"

            # Daemon binary
            cp "artifacts/kraken-daemon-$platform/kraken" "release/$platform/kraken"
            chmod +x "release/$platform/kraken"

            # App bundle (JS + skills — platform-independent)
            cp -r artifacts/kraken-app-bundle/app "release/$platform/app"
            cp artifacts/kraken-app-bundle/worker.js "release/$platform/worker.js"
            cp artifacts/kraken-app-bundle/channel-worker.js "release/$platform/channel-worker.js"
            cp -r artifacts/kraken-app-bundle/skills "release/$platform/skills"

            # Create tarball
            tar -czf "kraken-$platform.tar.gz" -C "release/$platform" .
            echo "  ✓ kraken-$platform.tar.gz ($(du -h "kraken-$platform.tar.gz" | cut -f1))"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kraken ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: kraken-*.tar.gz
