name: 🔖 Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (patch, minor, or major)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  bump:
    name: 🔖 Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Calculate next version
        id: bump
        run: |
          CURRENT=$(jq -r .version version.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "{\"version\":\"${NEXT}\"}" | jq . > version.json
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: 🚀 Trigger release workflow
        run: |
          gh workflow run "🚀 Release" --field tag="v${{ steps.bump.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
