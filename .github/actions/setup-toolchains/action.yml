name: 🔧 Setup Toolchains
description: Install Bun, Rust, Go, protoc, and all project dependencies with layer caching

runs:
  using: composite
  steps:
    - name: 🥟 Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10

    - name: 🦀 Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 🐹 Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: apps/gateway/go.mod

    - name: 📦 Setup protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}

    - name: 💾 Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          apps/scheduler/target
        key: rust-${{ runner.os }}-${{ hashFiles('apps/scheduler/Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-

    - name: 💾 Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: 📥 Install dependencies
      shell: bash
      run: bun install
